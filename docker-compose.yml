
services:
  postgres:
    image: postgres:16
    container_name: ps-postgres
    environment:
      POSTGRES_USER: marwa
      POSTGRES_PASSWORD: 112233445566
      POSTGRES_DB: psdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  tomcat:
    build: .
    image: ps-tomcat:1.0
    container_name: ps-tomcat
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: ps-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tomcat
    restart: unless-stopped

volumes:
  pgdata:
